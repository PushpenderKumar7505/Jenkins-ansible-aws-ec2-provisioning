---
- name: Create EC2
  hosts: localhost
  gather_facts: no

  vars:
    region: "us-west-2"
    ami_id: "ami-0cc96c4cd98401dae"
    instance_type: "t3.micro"
    key_name: "Pushpender"
    security_group_name: "my-sg1"
    subnet_id: "subnet-091d3132bcf1a71a0"

  tasks:
    - name: Create a security group
      amazon.aws.ec2_group:
        name: "{{ security_group_name }}"
        description: "Security group for EC2 instance"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "0.0.0.0/0"
        state: present
      register: sg

    - name: Create an EC2 instance
      amazon.aws.ec2_instance:
        name: "jenkins-ansible-demo"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        region: "{{ region }}"
        security_groups:
          - "{{ sg.group_name }}"
        subnet_id: "{{ subnet_id }}"
        count: 1
        wait: yes
      register: ec2_instance

    - name: Show created instance
      ansible.builtin.debug:
        msg: "Instance {{ ec2_instance.instances[0].instance_id }} is {{ ec2_instance.instances[0].state.name }}"
